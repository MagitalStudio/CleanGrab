[package]
name = "cleangrab"
version = "0.2.5"
description = "CleanGrab - local-first media converter and saver"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
regex = "1"
once_cell = "1"
dirs = "5"
url = "2"
# native-certs: trust the OS certificate store (antivirus / corporate HTTPS inspection
# installs its own root there). proxy-from-env: honour HTTPS_PROXY.
ureq = { version = "2", features = ["native-certs", "proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Checks downloaded tools against the checksums their publisher lists.
sha2 = "0.10"
rfd = "0.15"

# The shipped app: smaller and faster, at the cost of a slower build. Debug builds
# (`tauri dev`) keep the defaults.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
