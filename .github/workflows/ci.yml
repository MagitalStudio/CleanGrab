# SPDX-License-Identifier: GPL-3.0-only
# Checks every push and pull request: types, frontend build, Rust lints and tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Same version in every file
        run: npm run version:check

      - name: Type check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      # The Rust crate embeds dist/ at compile time, so the frontend is built first.
      - name: Frontend build
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --release -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release
